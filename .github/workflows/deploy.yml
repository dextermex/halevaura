name: Deploy to Cloudflare Pages

on:
  push:
    branches: [claude/magical-cray-houdqb]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: halevaura
      DOMAIN: halevaura.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Ensure Pages project exists
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch "${GITHUB_REF_NAME}" 2>/dev/null \
            && echo "created project $PROJECT" || echo "project $PROJECT already exists"

      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "${GITHUB_REF_NAME}" --commit-dirty=true

      - name: Attach the apex domain to the Pages project (subdomains are never touched)
        run: |
          # Remove the www alias if an earlier run attached it: the site runs on the apex only.
          curl -s -o /dev/null -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/www.$DOMAIN" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true
          for name in "$DOMAIN"; do
            code=$(curl -s -o /tmp/dom.json -w '%{http_code}' -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$name\"}")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "attached $name"
            elif grep -q '8000010\|already' /tmp/dom.json; then echo "$name already attached"
            else echo "::warning::could not attach $name (HTTP $code): $(cat /tmp/dom.json)"; fi
          done

      - name: Point the apex record at Pages (only when the zone is on this Cloudflare account)
        run: |
          # Only the record named exactly "$DOMAIN" is ever read or written here. Every other record in the
          # zone (phones.*, _railway-verify, mail, anything else) is left exactly as it is.
          zone=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then
            echo "::warning::Zone $DOMAIN is not on this Cloudflare account (or the token cannot read zones). Point the apex record for $DOMAIN at $PROJECT.pages.dev at your DNS provider."
            exit 0
          fi
          for name in "$DOMAIN"; do
            records=$(curl -s "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$name" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            if [ "$(echo "$records" | jq -r '.success')" != "true" ]; then
              echo "::warning::The token cannot read DNS records for $DOMAIN (needs Zone > DNS > Edit). Skipping; set the apex CNAME to $PROJECT.pages.dev by hand if it is not already."
              exit 0
            fi
            current=$(echo "$records" | jq -r '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | .[0] | "\(.type) \(.content)"')
            if [ "$current" = "CNAME $PROJECT.pages.dev" ]; then echo "$name already points at $PROJECT.pages.dev"; continue; fi
            existing=$(echo "$records" | jq -r '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | .[0].id // empty')
            body="{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true,\"ttl\":1}"
            if [ -n "$existing" ]; then
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$existing" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$body" | jq -r '"updated \(.result.name) -> \(.result.content) (success: \(.success))"'
            else
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$body" | jq -r '"created \(.result.name) -> \(.result.content) (success: \(.success))"'
            fi
          done

      - name: Verify the deployment and report domain state
        if: always()
        run: |
          echo "== https://$PROJECT.pages.dev =="
          curl -sS -o /tmp/live.html -w 'HTTP %{http_code}\n' "https://$PROJECT.pages.dev/"
          grep -o '<title>[^<]*</title>' /tmp/live.html || true
          echo "== DNS as seen from the public resolver =="
          echo "NS:    $(dig +short NS $DOMAIN | tr '\n' ' ')"
          echo "A:     $(dig +short A $DOMAIN | tr '\n' ' ')"
          echo "phones subdomain (must stay on Railway): $(dig +short CNAME phones.$DOMAIN | tr '\n' ' ')"
          echo "== Custom domains on the Pages project =="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[] | "\(.name): status=\(.status) certificate=\(.certificate_authority // "n/a") validation=\(.validation_data.status // "n/a") verification=\(.verification_data.status // "n/a")"'
